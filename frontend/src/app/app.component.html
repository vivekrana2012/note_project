<div class="container">
  <header>
    <h1>Myro</h1>
  </header>

  <div *ngIf="loading" class="loading">Loading videos...</div>
  
  <div *ngIf="error" class="error">{{ error }}</div>

  <div class="video-grid" *ngIf="!loading && !error">
    <div class="video-card" *ngFor="let video of videos">
      <a [href]="video.url" target="_blank" class="thumbnail-link">
        <img [src]="video.thumbnail" [alt]="video.title" class="thumbnail">
      </a>
      <div class="video-info" (click)="viewSummary(video)">
        <h2>{{ video.title }}</h2>
        <span class="date">{{ formatDate(video.publish_date) }}</span>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && videos.length === 0" class="empty">
    No videos found with summaries
  </div>
</div>

<!-- Summary Modal -->
<div class="modal-overlay" *ngIf="selectedVideo" (click)="closeSummary()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ selectedVideo.title }}</h2>
      <button class="close-btn" (click)="closeSummary()">&times;</button>
    </div>
    
    <div class="modal-body">
      <div *ngIf="loadingSummary" class="loading-summary">Loading summary...</div>
      
      <div *ngIf="!loadingSummary && summaryData" class="summary-content">
        <div *ngFor="let item of summaryData" class="entity-section">
          <h3>{{ item.entity }}</h3>
          <ul class="summary-list">
            <li *ngFor="let point of item.summary">{{ point }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
